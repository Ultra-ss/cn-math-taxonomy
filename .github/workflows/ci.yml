name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: scripts/validate.py
        run: python3 scripts/validate.py

      - name: scripts/check_figures.py
        run: python3 scripts/check_figures.py

      - name: scripts/verify_questions.py
        run: python3 scripts/verify_questions.py --report /tmp/physicalmap-verification-report.json

      - name: tests/test_validate.py
        run: python3 tests/test_validate.py

      - name: tests/test_blindspots.js
        run: node tests/test_blindspots.js

      - name: tests/test_children.js
        run: node tests/test_children.js

      - name: tests/test_ci_workflow.js
        run: node tests/test_ci_workflow.js

      - name: tests/test_diagnose_baseline.js
        run: node tests/test_diagnose_baseline.js

      - name: tests/test_engine.js
        run: node tests/test_engine.js

      - name: tests/test_home.js
        run: node tests/test_home.js

      - name: tests/test_pages_script_cache.js
        run: node tests/test_pages_script_cache.js

      - name: tests/test_question_ids.js
        run: node tests/test_question_ids.js

      - name: tests/test_report_link.js
        run: node tests/test_report_link.js

      - name: tests/test_stem_compat.js
        run: node tests/test_stem_compat.js

      - name: tests/test_two_subjects.js
        run: node tests/test_two_subjects.js

      - name: tests/test_wrongbook.js
        run: node tests/test_wrongbook.js

      - name: tests/test_explore_books.js
        run: node tests/test_explore_books.js

      - name: tests/test_progress.js
        run: node tests/test_progress.js

      - name: tests/test_textbook_order.js
        run: node tests/test_textbook_order.js

      - name: tests/test_compact_result.js
        run: node tests/test_compact_result.js

      - name: tests/test_graph_node_confirmation.js
        run: node tests/test_graph_node_confirmation.js

      - name: tests/test_local_center.js
        run: node tests/test_local_center.js

      - name: tests/test_last_location.js
        run: node tests/test_last_location.js

      - name: tests/test_explore_chapters.js
        run: node tests/test_explore_chapters.js

      - name: tests/test_explore_detail.js
        run: node tests/test_explore_detail.js

      - name: tests/test_focused_testing.js
        run: node tests/test_focused_testing.js

      - name: tests/test_explore_viewport.js
        run: node tests/test_explore_viewport.js

      - name: tests/test_mobile_explore_views.js
        run: node tests/test_mobile_explore_views.js

      - name: tests/test_local_learning.js
        run: node tests/test_local_learning.js

      - name: tests/test_book_selection.js
        run: node tests/test_book_selection.js

      - name: tests/test_explore_scope.js
        run: node tests/test_explore_scope.js

      - name: tests/test_explore_pro.js
        run: node tests/test_explore_pro.js

      - name: tests/test_pro_challenge.js
        run: node tests/test_pro_challenge.js

      - name: scripts/validate_pro_questions.py
        run: python3 scripts/validate_pro_questions.py

      - name: tests/test_pro_bank.js
        run: node tests/test_pro_bank.js

      - name: tests/test_challenge_scope.js
        run: node tests/test_challenge_scope.js

      - name: tests/test_achievement_books.js
        run: node tests/test_achievement_books.js

      - name: tests/test_graph_motion.js
        run: node tests/test_graph_motion.js

      - name: 课标映射严格模式（仅报告）
        continue-on-error: true
        env:
          STRICT_STANDARDS: "1"
        run: python3 scripts/validate.py
